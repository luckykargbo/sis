name: sis_mobile
description: "Standards International School (S.I.S.) Cross-Platform Mobile Management Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  
  # Networking & Backend Integration (Convex REST API)
  dio: ^5.5.0
  http: ^1.2.2
  
  # Storage & Offline Sync
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  
  # Push Notifications & Connectivity
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.1
  connectivity_plus: ^6.0.3
  
  # WebRTC Video Calling (Interviews / Virtual Classrooms)
  flutter_webrtc: ^0.10.9
  
  # UI & Design System
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
